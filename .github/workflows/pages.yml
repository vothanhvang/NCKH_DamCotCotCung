name: Deploy SRC-CES Nonlinear Studio Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Verify docs/ contains updated build
        run: |
          test -f docs/index.html
          test -f docs/main.dart.js
          ! grep -Fq 'Ng\xf4 C\u01b0\u1eddng' docs/main.dart.js
          ! grep -Fq 'Ngo Cuong' docs/main.dart.js
          grep -Fq 'Ng\xf4 H\u1eefu C\u01b0\u1eddng' docs/main.dart.js
      - name: Upload static Flutter Web artifact from docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
